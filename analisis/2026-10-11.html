<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Picks del domingo 11 de octubre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #E9EEF4;
    --panel: #FFFFFF;
    --ink: #0E1A2B;
    --muted: #52627A;
    --line: #D3DCE7;
    --plate: #0E1A2B;
    --plate-ink: #EEF2F6;
    --led: #FFB627;
    --win: #1F9D5C;
    --loss: #D9363E;
    --draw: #8A97A8;
    --focus: #2F6FED;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0B1522;
      --panel: #132235;
      --ink: #EEF2F6;
      --muted: #94A6BD;
      --line: #22344B;
      --plate: #08111C;
      --win: #34C77B;
      --loss: #F0575E;
      --draw: #7C8BA1;
      --focus: #7FA7FF;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 400 16px/1.55 "Barlow", system-ui, sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px; }
  h1, h2, h4, .led, .clock, .team span, .record b {
    font-family: "Barlow Condensed", "Barlow", system-ui, sans-serif;
  }
  a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  /* Top */
  .top h1 { font-size: 34px; line-height: 1.05; margin: 8px 0 14px; font-weight: 700; }
  .record { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .record div {
    background: var(--plate); color: var(--plate-ink);
    border-radius: 10px; padding: 10px 14px; display: flex; align-items: baseline; gap: 8px;
  }
  .record b { color: var(--led); font-size: 26px; font-weight: 700; letter-spacing: .02em; }
  .record span { font-size: 14px; color: #B9C6D6; }

  /* Sport sections */
  .sport h2 { font-size: 24px; font-weight: 700; margin: 34px 0 12px; }
  .game {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
    scroll-margin-top: 12px;
  }
  .game:target { border-color: var(--led); box-shadow: 0 0 0 2px var(--led); }
  .comp { margin: 0 0 8px; font-size: 14px; color: var(--muted); }

  /* Matchup */
  .matchup { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px; }
  .team { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; min-width: 0; }
  .team img, .nologo { width: 40px; height: 40px; object-fit: contain; }
  .nologo { border-radius: 50%; background: var(--line); display: block; }
  .team span { font-size: 17px; font-weight: 600; line-height: 1.1; overflow-wrap: break-word; hyphens: auto; max-width: 100%; }
  .team.long span { font-size: 15px; }
  .clock { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 84px; text-align: center; }
  .clock .time { font-size: 22px; font-weight: 700; }
  .clock .count { font-size: 13px; color: var(--muted); font-family: "Barlow", sans-serif; }

  /* The scoreboard plate: the one loud element */
  .pick {
    margin-top: 14px;
    background: var(--plate);
    color: var(--plate-ink);
    border-radius: 12px;
    padding: 12px 16px;
    display: flex; align-items: center; gap: 16px;
  }
  .led {
    font-size: 60px; line-height: .9; font-weight: 700; color: var(--led);
    text-shadow: 0 0 14px rgba(255, 182, 39, .45);
    font-variant-numeric: tabular-nums;
  }
  .led span { font-size: 30px; margin-left: 2px; }
  .pick-text { display: flex; flex-direction: column; min-width: 0; }
  .pick-kicker { font-size: 14px; color: #B9C6D6; }
  .pick-text strong { font: 700 24px/1.1 "Barlow Condensed", sans-serif; overflow-wrap: break-word; }
  .tier { font-size: 14px; color: var(--led); margin-top: 2px; }

  /* Blocks */
  .block { margin-top: 16px; }
  .block h4 { font-size: 18px; font-weight: 600; margin: 0 0 8px; }
  .analysis p { margin: 0 0 10px; max-width: 70ch; }
  .fine { font-size: 14px; color: var(--muted); margin: 6px 0 0; }

  .markets { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .markets li {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line);
  }
  .markets li b { font-variant-numeric: tabular-nums; }
  .markets li.strong { border-color: var(--led); }
  .markets li.strong b { color: var(--plate); background: var(--led); border-radius: 6px; padding: 0 6px; }

  .form-row { display: grid; grid-template-columns: minmax(0, 1fr) auto 36px; gap: 10px; align-items: center; padding: 4px 0; }
  .fname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dots { display: flex; gap: 5px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
  .dot.W { background: var(--win); }
  .dot.L { background: var(--loss); }
  .dot.D { background: var(--draw); }
  .frec { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

  .h2h { width: 100%; border-collapse: collapse; font-size: 15px; }
  .h2h th { text-align: left; font-weight: 500; color: var(--muted); padding: 4px 6px; border-bottom: 1px solid var(--line); }
  .h2h td { padding: 6px; border-bottom: 1px solid var(--line); }
  .h2h .num { text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }

  .empty { color: var(--muted); }
  footer { margin-top: 32px; font-size: 14px; color: var(--muted); }

  /* Lock screen */
  .lock { max-width: 360px; margin: 18vh auto 0; text-align: center; }
  .lock h1 { font-size: 30px; margin: 0 0 8px; }
  .lock p { color: var(--muted); margin: 0 0 18px; }
  .lock form { display: flex; gap: 8px; }
  .lock input {
    flex: 1; min-width: 0; font: inherit; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  }
  .lock button {
    font: 600 16px "Barlow", sans-serif; padding: 10px 16px; border: 0; border-radius: 10px;
    background: var(--plate); color: var(--led); cursor: pointer;
  }
  .lock .err { color: var(--loss); margin-top: 12px; min-height: 1.5em; }
  @media (prefers-reduced-motion: no-preference) {
    .game { animation: none; }
  }
</style>
</head>
<body>
<main id="app">
  <div class="lock" id="lock" hidden>
    <h1>Contenido para miembros</h1>
    <p>Abre esta página desde el botón del canal de Telegram, o escribe la clave del canal.</p>
    <form id="unlock">
      <label for="pw" class="sr" hidden>Clave</label>
      <input id="pw" type="password" autocomplete="current-password" placeholder="Clave del canal" required>
      <button type="submit">Entrar</button>
    </form>
    <p class="err" id="err" role="alert"></p>
  </div>
</main>

const STORE_KEY = "picks-clave";

function b64(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }

async function decrypt(pw) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const out = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.ct));
  return new TextDecoder().decode(out);
}

function fmtTime(d) {
  return d.toLocaleTimeString("es", { hour: "numeric", minute: "2-digit" });
}

function tick() {
  const now = Date.now();
  document.querySelectorAll(".clock").forEach(el => {
    const s = el.dataset.start;
    if (!s) return;
    const start = new Date(s);
    if (isNaN(start)) return;
    el.querySelector(".time").textContent = fmtTime(start);
    const mins = Math.round((start - now) / 60000);
    let txt;
    if (mins > 24 * 60) txt = start.toLocaleDateString("es", { weekday: "long" });
    else if (mins >= 60) txt = "Empieza en " + Math.floor(mins / 60) + " h " + (mins % 60) + " min";
    else if (mins > 0) txt = "Empieza en " + mins + " min";
    else if (mins > -240) txt = "En juego o recién terminado";
    else txt = "Terminado";
    el.querySelector(".count").textContent = txt;
  });
}

function show(html) {
  const app = document.getElementById("app");
  app.innerHTML = html;
  tick();
  setInterval(tick, 30000);
  if (location.hash.length > 1 && !location.hash.startsWith("#k=")) {
    const target = document.getElementById(location.hash.slice(1));
    if (target) target.scrollIntoView();
  }
}

function hashParts() {
  // Link format: page.html#k=<clave>&g=<game-anchor>
  const params = new URLSearchParams(location.hash.slice(1));
  return { key: params.get("k"), game: params.get("g") };
}

async function tryKey(pw, remember) {
  const html = await decrypt(pw);
  if (remember) { try { localStorage.setItem(STORE_KEY, pw); } catch (e) {} }
  const { game } = hashParts();
  history.replaceState(null, "", location.pathname + location.search + (game ? "#" + game : ""));
  show(html);
}

async function start() {
  if (PAYLOAD.plain !== undefined) { show(PAYLOAD.plain); return; }
  const { key } = hashParts();
  let saved = null;
  try { saved = localStorage.getItem(STORE_KEY); } catch (e) {}
  for (const pw of [key, saved]) {
    if (!pw) continue;
    try { await tryKey(pw, true); return; } catch (e) {}
  }
  const lock = document.getElementById("lock");
  lock.hidden = false;
  document.getElementById("unlock").addEventListener("submit", async ev => {
    ev.preventDefault();
    const err = document.getElementById("err");
    err.textContent = "";
    try { await tryKey(document.getElementById("pw").value, true); }
    catch (e) { err.textContent = "Esa clave no abre esta página. Usa el botón del canal o la clave más reciente."; }
  });
}
start();
</script>
