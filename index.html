<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¡Pago confirmado!</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1115;
    color: #eef0f3;
    margin: 0;
    padding: 24px 16px 48px;
    display: flex;
    justify-content: center;
  }
  .card {
    max-width: 480px;
    width: 100%;
    background: #171a21;
    border: 1px solid #2a2e38;
    border-radius: 16px;
    padding: 28px 24px;
    text-align: center;
  }
  .check {
    font-size: 48px;
    margin-bottom: 8px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 8px;
  }
  p {
    font-size: 15px;
    line-height: 1.5;
    color: #b7bcc6;
    margin: 0 0 20px;
  }
  .btn {
    display: inline-block;
    background: #2aabee;
    color: #ffffff;
    text-decoration: none;
    font-weight: 600;
    font-size: 16px;
    padding: 14px 28px;
    border-radius: 10px;
    width: 100%;
    box-sizing: border-box;
  }
  .btn:active { opacity: 0.85; }
  .note {
    font-size: 12px;
    color: #7a7f8a;
    margin-top: 18px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="check">✅</div>
    <h1>¡Tu pago se confirmó!</h1>
    <p>
      Toca el botón de abajo para unirte al canal privado de Telegram.
      El link es de un solo uso para ti.
    </p>

    <a class="btn" href="https://t.me/+GVxzUdq8-y5jNWVh">Unirme al canal</a>

    <p class="note">
      Si el botón no funciona, escríbenos y te lo reenviamos.
    </p>
  </div>
</body>
</html>
